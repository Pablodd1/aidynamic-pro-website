<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Bold Minimalist Monogram -->
  <g transform="translate(20, 10)">
    <!-- A + D + P monogram in a square -->
    <rect x="5" y="5" width="80" height="80" rx="16" fill="none" stroke="url(#grad3)" stroke-width="3"/>
    <!-- A -->
    <path d="M25 65 L40 25 L55 65" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="32" y1="50" x2="48" y2="50" stroke="#e2e8f0" stroke-width="2.5"/>
    <!-- D -->
    <path d="M60 25 L60 65 Q75 65 75 45 Q75 25 60 25" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
    <!-- Connection slash -->
    <line x1="58" y1="25" x2="42" y2="65" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
    <!-- Dynamic dot -->
    <circle cx="72" cy="35" r="3" fill="#3b82f6">
      <animate attributeName="cy" values="35;55;35" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Text — tight, modern typography -->
  <text x="118" y="48" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#e2e8f0" letter-spacing="-0.5">AI DYNAMIC</text>
  <text x="118" y="75" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="url(#grad3)" letter-spacing="-0.5">PRO</text>
  <!-- Accent line -->
  <rect x="118" y="85" width="50" height="3" rx="1.5" fill="#3b82f6">
    <animate attributeName="width" values="50;80;50" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="118" y="105" font-family="'Inter', sans-serif" font-size="8" fill="#64748b" letter-spacing="2.5">AUTOMATION EXPERTS</text>
</svg>
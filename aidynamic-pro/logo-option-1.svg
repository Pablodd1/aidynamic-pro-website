<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Geometric AI Node -->
  <g transform="translate(20, 10)">
    <!-- Hexagon frame -->
    <path d="M50 5 L90 25 L90 65 L50 85 L10 65 L10 25 Z" fill="none" stroke="url(#grad1)" stroke-width="2.5"/>
    <!-- Inner circuitry -->
    <circle cx="50" cy="45" r="12" fill="url(#grad1)" opacity="0.9"/>
    <circle cx="50" cy="45" r="4" fill="#0a0e1a"/>
    <!-- Connection lines -->
    <line x1="50" y1="5" x2="50" y2="33" stroke="url(#grad1)" stroke-width="1.5"/>
    <line x1="90" y1="25" x2="62" y2="45" stroke="url(#grad1)" stroke-width="1.5"/>
    <line x1="90" y1="65" x2="62" y2="45" stroke="url(#grad1)" stroke-width="1.5"/>
    <line x1="50" y1="85" x2="50" y2="57" stroke="url(#grad1)" stroke-width="1.5"/>
    <line x1="10" y1="65" x2="38" y2="45" stroke="url(#grad1)" stroke-width="1.5"/>
    <line x1="10" y1="25" x2="38" y2="45" stroke="url(#grad1)" stroke-width="1.5"/>
    <!-- Data pulses -->
    <circle cx="50" cy="19" r="2" fill="#06b6d4">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="76" cy="35" r="2" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="76" cy="55" r="2" fill="#3b82f6">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Text -->
  <text x="130" y="55" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="700" fill="#e2e8f0">AI Dynamic</text>
  <text x="130" y="85" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="700" fill="url(#grad1)">Pro</text>
  <text x="130" y="105" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" letter-spacing="3">AUTOMATION INTELLIGENCE</text>
</svg>